template:
  - sensor:
      - name: Pool Mode
        unique_id: pool_mode
        icon: |
          {% set service_mode = states('sensor.aqualinkd_service_mode') %}
          {% set spa_state = states('switch.aqualinkd_spa') %}
          {% set filter_state = states('switch.aqualinkd_filter_pump') %}
          {% if service_mode in ['service', 'timeout'] %}
            mdi:tools
          {% elif state_attr('switch.aqualinkd_filter_pump', 'delay') | int(0) == 1 %}
            mdi:timer-sand
          {% elif spa_state == 'on' %}
            mdi:hot-tub
          {% elif filter_state == 'on' and spa_state == 'off' %}
            mdi:pump
          {% elif filter_state == 'off' and spa_state == 'off' %}
            mdi:pump-off
          {% else %}
            mdi:help-circle
          {% endif %}
        state: |
          {% set service_mode = states('sensor.aqualinkd_service_mode') %}
          {% set spa_state = states('switch.aqualinkd_spa') %}
          {% set filter_state = states('switch.aqualinkd_filter_pump') %}
          {% if service_mode in ['service', 'timeout'] %}
            {{ service_mode }}
          {% elif state_attr('switch.aqualinkd_filter_pump', 'delay') | int(0) == 1 %}
            delay
          {% elif spa_state == 'on' %}
            spa
          {% elif filter_state == 'on' and spa_state == 'off' %}
            filter
          {% elif filter_state == 'off' and spa_state == 'off' %}
            off
          {% else %}
            unknown
          {% endif %}
        availability: "{{ not is_state('switch.aqualinkd_filter_pump', 'unavailable') and not is_state('switch.aqualinkd_spa', 'unavailable') }}"

  - binary_sensor:
      - name: Pool Spa Ready
        unique_id: pool_spa_ready
        icon: mdi:hot-tub
        state: >
          {% set spa_on = is_state('switch.aqualinkd_spa', 'on') %}
          {% set heater_heat = is_state('climate.aqualinkd_spa_heater', 'heat') %}
          {% set current = state_attr('climate.aqualinkd_spa_heater', 'current_temperature') | float(none) %}
          {% set target = state_attr('climate.aqualinkd_spa_heater', 'temperature') | float(none) %}
          {% set near_target = current is not none and target is not none and current >= (target - 1) %}
          {{ spa_on and heater_heat and near_target }}
        attributes:
          temp_delta: >
            {% set current = state_attr('climate.aqualinkd_spa_heater', 'current_temperature') | float(none) %}
            {% set target = state_attr('climate.aqualinkd_spa_heater', 'temperature') | float(none) %}
            {% if current is not none and target is not none %}
              {{ (target - current) | round(1) }}
            {% else %}
              unknown
            {% endif %}
        availability: >
          {{
            not is_state('switch.aqualinkd_spa', 'unavailable')
            and not is_state('climate.aqualinkd_spa_heater', 'unavailable')
            and state_attr('climate.aqualinkd_spa_heater', 'current_temperature') is not none
            and state_attr('climate.aqualinkd_spa_heater', 'temperature') is not none
          }}

  - switch:
      - name: Pool Sheers Toggle
        unique_id: pool_sheers_toggle
        state: "{{ is_state('switch.aqualinkd_sheers', 'on') }}"
        turn_on:
          - condition: state
            entity_id: switch.aqualinkd_spa
            state: "off"
          - action: switch.turn_on
            target:
              entity_id: switch.aqualinkd_sheers
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.aqualinkd_sheers

script:
  pool_spa_on:
    alias: Pool Spa On
    description: Turn on spa circulation and set spa heater to heat when service mode allows it.
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: sensor.aqualinkd_service_mode
            state: service
        then:
          - stop: "Pool Spa On blocked: service mode is 'service'."
      - if:
          - condition: state
            entity_id: sensor.aqualinkd_service_mode
            state: timeout
        then:
          - stop: "Pool Spa On blocked: service mode is 'timeout'."
      - action: switch.turn_on
        target:
          entity_id: switch.aqualinkd_spa
      - action: switch.turn_on
        target:
          entity_id: switch.aqualinkd_jet_pump
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.aqualinkd_spa_heater
        data:
          hvac_mode: heat

  pool_spa_off:
    alias: Pool Spa Off
    description: Always force spa heater and spa circulation off.
    mode: single
    sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.aqualinkd_spa_heater
        data:
          hvac_mode: "off"
      - action: switch.turn_off
        target:
          entity_id: switch.aqualinkd_jet_pump
      - action: switch.turn_off
        target:
          entity_id: switch.aqualinkd_spa

  pool_spa_toggle:
    alias: Pool Spa Toggle
    description: Toggle spa by delegating to Pool Spa On/Off scripts.
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.aqualinkd_spa
                state: "on"
            sequence:
              - action: script.pool_spa_off
        default:
          - action: script.pool_spa_on
