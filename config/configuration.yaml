
# Loads default set of integrations.
# Do not remove unless declaring each manually
default_config:
# Manually declare all except those I don't want.
# assist_pipeline:
# backup:
# bluetooth:
# config:
# conversation:
# dhcp:
# energy:
# file:
# go2rtc:
# history:
# homeassistant_alerts:
# cloud:
# image_upload:
# logbook:
# media_source:
# mobile_app:
# my:
# ssdp:
# stream:
# sun:
# usage_prediction:
# usb:
# webhook:
# zeroconf:

# Support LG WebOS TV WOL
wake_on_lan:

homeassistant:
  name: Home
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: 14
  unit_system: us_customary
  time_zone: America/New_York
  internal_url: https://ha.clark.zone
  packages: !include_dir_named packages

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/16

recorder:
  db_url: !env_var POSTGRES_URI
  purge_keep_days: 60
  commit_interval: 5 # default is 5

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/community/custom-brand-icons/custom-brand-icons.js
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421

# Handmade automations
automation manual: !include_dir_merge_list automations/
# Automations created in UI
automation ui: !include automations.yaml
script: !include scripts.yaml
scene: !include_dir_merge_list scenes/
# sensor: !include_dir_merge_list sensors/
template: !include_dir_merge_list templates/
